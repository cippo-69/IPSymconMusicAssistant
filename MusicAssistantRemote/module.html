<style>
  :root {
    --ma-accent: #FD5D05;
    --ma-text: inherit;
    --ma-bg: rgba(127,127,127,.07);
    --ma-bg2: rgba(127,127,127,.14);
    --ma-line: rgba(127,127,127,.22);
    --ma-muted: rgba(127,127,127,1);
    --ma-top: 40px;          /* Platz für Titel und Vergrößern-Symbol der Symcon-Kachel */
    --ma-nav: 58px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Poppins', 'Work Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 14px; line-height: 1.35; }
  button { font: inherit; color: inherit; }
  svg { width: 1em; height: 1em; fill: currentColor; display: block; }

  #ma { position: absolute; inset: 0; display: flex; flex-direction: column; padding-top: var(--ma-top); }
  .view { display: none; flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 12px; }
  .view.active { display: block; }

  /* Navigation unten wie in der Music-Assistant-App */
  .nav { flex: none; height: var(--ma-nav); display: flex; border-top: 1px solid var(--ma-line); }
  .nav button { flex: 1; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--ma-muted); padding: 0; }
  .nav button svg { font-size: 22px; }
  .nav button.active { color: var(--ma-accent); }

  /* Geräteauswahl */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips.wrap { flex-wrap: wrap; overflow: visible; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--ma-line); background: none; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .chip.on { background: var(--ma-accent); border-color: var(--ma-accent); color: #fff; }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* Jetzt läuft */
  .np { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 6px; }
  .cover { width: min(58vw, 46vh, 260px); aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--ma-bg2); display: flex; align-items: center; justify-content: center; color: var(--ma-muted); box-shadow: 0 6px 18px rgba(0,0,0,.12); }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .cover svg { font-size: 56px; opacity: .45; }
  .meta { text-align: center; width: 100%; min-width: 0; }
  .meta .t { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .a { color: var(--ma-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctrl { display: flex; gap: 18px; align-items: center; justify-content: center; }
  .ib { border: 0; background: none; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; padding: 0; }
  .ib:hover { background: var(--ma-bg2); }
  .ib.sm { width: 34px; height: 34px; font-size: 18px; }
  .ib.on { color: var(--ma-accent); }
  .ib.main { width: 58px; height: 58px; font-size: 26px; background: var(--ma-accent); color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.18); }
  .ib.main:hover { filter: brightness(1.08); background: var(--ma-accent); }
  .ib.fill { background: var(--ma-accent); color: #fff; }
  .hint { color: var(--ma-muted); font-size: 13px; text-align: center; }
  .link { border: 0; background: none; color: var(--ma-accent); cursor: pointer; font-weight: 600; padding: 4px; }

  /* Lautstärke */
  .vol { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 420px; }
  .vol .v { width: 40px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ma-muted); font-size: 13px; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 26px; background: none; margin: 0; cursor: pointer; --p: 50%; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--ma-accent) var(--p), var(--ma-line) var(--p)); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--ma-line); }
  input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--ma-accent); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--ma-accent); margin-top: -6px; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--ma-accent); border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); }

  /* Suche */
  .search { display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; border-radius: 12px; border: 1px solid var(--ma-line); background: var(--ma-bg); margin-bottom: 8px; }
  .search svg { font-size: 18px; color: var(--ma-muted); flex: none; }
  .search input { flex: 1; min-width: 0; padding: 10px 0; border: 0; outline: 0; background: none; color: inherit; font: inherit; }
  .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--ma-muted); margin: 10px 0 4px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 6px; margin: 0 -6px; border-radius: 10px; cursor: pointer; }
  .item:hover { background: var(--ma-bg); }
  .thumb { width: 46px; height: 46px; border-radius: 8px; overflow: hidden; background: var(--ma-bg2); flex: none; display: flex; align-items: center; justify-content: center; color: var(--ma-muted); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb svg { font-size: 20px; opacity: .5; }
  .txt { flex: 1; min-width: 0; }
  .txt .n { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .txt .s { font-size: 12px; color: var(--ma-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Geräte */
  .dev { padding: 10px 12px; border-radius: 14px; background: var(--ma-bg); margin-bottom: 8px; }
  .dev.na { opacity: .5; }
  .dev .head { display: flex; align-items: center; gap: 10px; }
  .dev .thumb { width: 42px; height: 42px; }
  .dev .txt .n { font-weight: 600; }
  .dev .vol { max-width: none; margin-top: 4px; }
  .tone { display: none; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--ma-line); }
  .tone.open { display: block; }
  .tone .row { display: flex; align-items: center; gap: 8px; }
  .tone .row > span:first-child { width: 92px; color: var(--ma-muted); font-size: 13px; }
  .tone .row .v { width: 64px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .switch { margin-left: auto; border: 0; cursor: pointer; width: 40px; height: 22px; border-radius: 11px; background: var(--ma-line); position: relative; padding: 0; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on { background: var(--ma-accent); }
  .switch.on::after { left: 21px; }

  .sync { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--ma-line); font-size: 13px; }
  .sync .lbl { font-weight: 600; }
  .sync .s { color: var(--ma-muted); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--ma-accent); color: #fff; margin-left: 6px; vertical-align: 1px; }
  .badge.f { background: var(--ma-bg2); color: inherit; }
  .favhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .slot { display: flex; align-items: center; gap: 10px; padding: 5px 6px; margin: 0 -6px; border-radius: 10px; }
  .slot.fill { cursor: pointer; }
  .slot.fill:hover { background: var(--ma-bg); }
  .slot .no { width: 20px; text-align: right; font-size: 12px; color: var(--ma-muted); font-variant-numeric: tabular-nums; flex: none; }
  .slot.free .txt .n { color: var(--ma-muted); font-weight: 400; font-style: italic; }
  .slot input { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--ma-line); background: var(--ma-bg); color: inherit; font: inherit; }
  .slot .ib.sm { width: 30px; height: 30px; font-size: 16px; }
  .ib.star.on { color: var(--ma-accent); }
  .edit { border: 1px solid var(--ma-line); background: none; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; flex: none; }
  .edit.on { background: var(--ma-accent); border-color: var(--ma-accent); color: #fff; }
  .empty { color: var(--ma-muted); padding: 24px 8px; text-align: center; }
  #toast { position: absolute; left: 50%; bottom: calc(var(--ma-nav) + 10px); transform: translateX(-50%); background: rgba(30,30,30,.92); color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 13px; display: none; z-index: 9; white-space: nowrap; }

  /* kleine Kachel: nur das Nötigste */
  @media (max-height: 330px) {
    .nav { display: none; }
    .view { display: none !important; }
    #v-now { display: block !important; }
    .cover { display: none; }
    .np { gap: 6px; }
  }
</style>

<div id="ma">
  <div class="view active" id="v-now">
    <div class="chips" id="nowChips"></div>
    <div id="nowBox"></div>
  </div>

  <div class="view" id="v-search">
    <div class="search">
      <svg viewBox="0 0 24 24"><path d="M9.5 3a6.5 6.5 0 0 1 5.2 10.4l5.4 5.4-1.4 1.4-5.4-5.4A6.5 6.5 0 1 1 9.5 3zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg>
      <input id="q" type="search" placeholder="Music or radio …" autocomplete="off" enterkeyhint="search">
      <button class="ib sm fill" id="qbtn" title="Search"><svg viewBox="0 0 24 24"><path d="M5 11h11.2l-4.6-4.6L13 5l7 7-7 7-1.4-1.4 4.6-4.6H5z"/></svg></button>
    </div>
    <div class="chips wrap" id="typeChips"></div>
    <div class="label" id="targetLabel">Play on</div>
    <div class="chips wrap" id="targetChips"></div>
    <div id="results"></div>
  </div>

  <div class="view" id="v-favs">
    <div class="chips wrap" id="favTypeChips"></div>
    <div class="favhead"><div class="label">Play on</div><button class="edit" id="favEdit">Edit</button></div>
    <div class="chips wrap" id="favTargetChips"></div>
    <div id="favList"></div>
  </div>

  <div class="view" id="v-devices">
    <div id="devList"></div>
  </div>

  <div class="nav">
    <button class="active" data-v="now"><svg viewBox="0 0 24 24"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3h-6z"/></svg><span>Now playing</span></button>
    <button data-v="search"><svg viewBox="0 0 24 24"><path d="M9.5 3a6.5 6.5 0 0 1 5.2 10.4l5.4 5.4-1.4 1.4-5.4-5.4A6.5 6.5 0 1 1 9.5 3zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg><span>Search</span></button>
    <button data-v="favs"><svg viewBox="0 0 24 24"><path d="M12 17.3 18.2 21l-1.6-7 5.4-4.7-7.2-.6L12 2 9.2 8.7l-7.2.6 5.4 4.7-1.6 7z"/></svg><span>Favorites</span></button>
    <button data-v="devices"><svg viewBox="0 0 24 24"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm5 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg><span>Players</span></button>
  </div>
  <div id="toast"></div>
</div>

<script>
  const MA = { favType: 'playlist', favEdit: false, state: { players: [], types: [], showTone: true, connected: false, favs: {} }, current: null, targets: new Set(), types: new Set(), openTone: new Set(), drag: {}, lastResults: null };
  const TYPE_LABEL = { playlist: 'Playlists', radio: 'Radio', track: 'Tracks', album: 'Albums', artist: 'Artists' };
  const P = {
    play: 'M8 5v14l11-7z',
    pause: 'M6 5h4v14H6zm8 0h4v14h-4z',
    prev: 'M6 6h2v12H6zm3.5 6L18 18V6z',
    next: 'M16 6h2v12h-2zM6 18l8.5-6L6 6z',
    vol: 'M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z',
    mute: 'M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.4 2.4c.1-.2.1-.4.1-.6zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A8.8 8.8 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3a7 7 0 0 1-2.3 1.2v2.1a9 9 0 0 0 3.7-1.8l2 2 1.3-1.3-9-9L4.3 3zM12 4 9.9 6.1 12 8.2V4z',
    power: 'M13 3h-2v10h2V3zm4.8 2.2-1.4 1.4A7 7 0 1 1 7.6 6.6L6.2 5.2A9 9 0 1 0 17.8 5.2z',
    tone: 'M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z',
    note: 'M12 3v10.6A4 4 0 1 0 14 17V7h4V3h-6z',
    radio: 'M20 6H8.3l8.3-3.4L15.9 1 3.2 6.2C2.5 6.5 2 7.2 2 8v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zM7 20a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm13-8h-2v-2h-2v2H4V8h16v4z',
    star: 'M12 17.3 18.2 21l-1.6-7 5.4-4.7-7.2-.6L12 2 9.2 8.7l-7.2.6 5.4 4.7-1.6 7z',
    starO: 'M22 9.2l-7.2-.6L12 2 9.2 8.6 2 9.2l5.5 4.7L5.8 21 12 17.3 18.2 21l-1.6-7.1L22 9.2zM12 15.4l-3.8 2.3 1-4.3-3.3-2.9 4.4-.4L12 6.1l1.7 4 4.4.4-3.3 2.9 1 4.3-3.8-2.3z',
    up: 'M7.4 15.4 12 10.8l4.6 4.6L18 14l-6-6-6 6z',
    down: 'M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z',
    del: 'M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z',
    speaker: 'M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm5 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4z'
  };
  const svg = (k) => `<svg viewBox="0 0 24 24"><path d="${P[k]}"/></svg>`;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const T = (s) => (typeof translate === 'function' ? translate(s) : s);

  function send(ident, value) { requestAction(ident, JSON.stringify(value)); }
  function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(MA.tt); MA.tt = setTimeout(() => el.style.display = 'none', 2500); }
  function player(id) { return MA.state.players.find((p) => p.id === id); }
  function stateText(p) {
    if (!p.available) return T('not available');
    if (p.state === 'playing') return [p.title, p.artist].filter(Boolean).join(' – ') || T('playing');
    if (p.state === 'paused') return T('paused') + (p.title ? ': ' + p.title : '');
    return T('idle');
  }
  function thumb(img, icon) {
    return `<div class="thumb">${img ? `<img src="${esc(img)}" loading="lazy" onerror="this.remove()">` : ''}${img ? '' : svg(icon)}</div>`;
  }
  function paintRange(r) { const min = +r.min, max = +r.max; r.style.setProperty('--p', ((r.value - min) / (max - min) * 100) + '%'); }

  // ---------- Navigation ----------
  function show(v) {
    document.querySelectorAll('.nav button').forEach((b) => b.classList.toggle('active', b.dataset.v === v));
    document.querySelectorAll('.view').forEach((x) => x.classList.toggle('active', x.id === 'v-' + v));
    if (v === 'search') setTimeout(() => $('q').focus(), 50);
  }
  document.querySelectorAll('.nav button').forEach((b) => b.addEventListener('click', () => show(b.dataset.v)));

  // ---------- Jetzt läuft ----------
  function renderNow() {
    const ps = MA.state.players.filter((p) => p.available);
    if (!MA.current || !player(MA.current)) {
      const playing = ps.find((p) => p.state === 'playing');
      MA.current = (playing || ps[0] || {}).id || null;
    }
    $('nowChips').innerHTML = ps.map((p) => `<button class="chip ${p.id === MA.current ? 'on' : ''}" data-id="${esc(p.id)}">${p.state === 'playing' ? '<span class="dot"></span>' : ''}${esc(p.name)}</button>`).join('');
    $('nowChips').querySelectorAll('.chip').forEach((c) => c.onclick = () => { MA.current = c.dataset.id; renderNow(); });
    const p = player(MA.current);
    if (!p) { $('nowBox').innerHTML = `<div class="empty">${T(MA.state.connected ? 'No players' : 'Not connected to Music Assistant')}</div>`; return; }
    const active = p.state === 'playing' || p.state === 'paused';
    const cover = `<div class="cover">${p.image ? `<img src="${esc(p.image)}" onerror="this.remove()">` : svg('note')}</div>`;
    $('nowBox').innerHTML = `<div class="np">${cover}
      <div class="meta"><div class="t">${esc(p.title || p.name)}</div><div class="a">${esc(p.title ? p.artist : stateText(p))}</div></div>
      ${active && p.uri && TYPE_LABEL[p.mediaType] ? `<button class="ib sm star ${isFav(p.mediaType, p.uri) ? 'on' : ''}" data-favnow="1" title="${T('Save as favorite')}">${svg(isFav(p.mediaType, p.uri) ? 'star' : 'starO')}</button>` : ''}
      ${active ? `<div class="ctrl">
        <button class="ib" data-c="previous">${svg('prev')}</button>
        <button class="ib main" data-c="play_pause">${svg(p.state === 'playing' ? 'pause' : 'play')}</button>
        <button class="ib" data-c="next">${svg('next')}</button>
      </div>` : `<div class="hint">${T('Nothing in the queue.')}</div><button class="link" data-go="search">${T('Choose music or radio')}</button>`}
      ${volumeRow(p)}</div>`;
    bindPlayerControls($('nowBox'), p);
    const fn = $('nowBox').querySelector('[data-favnow]');
    if (fn) fn.onclick = () => send('favAdd', { item: { type: p.mediaType, uri: p.uri, name: p.title, sub: p.artist, image: p.image } });
    const go = $('nowBox').querySelector('[data-go]');
    if (go) go.onclick = () => { MA.targets = new Set([p.id]); renderSearchChips(); show('search'); };
  }

  function volumeRow(p) {
    if (p.volume === null || p.volume === undefined) return '';
    return `<div class="vol"><button class="ib sm ${p.muted ? 'on' : ''}" data-mute="1">${svg(p.muted ? 'mute' : 'vol')}</button>
      <input type="range" min="0" max="100" step="1" value="${p.volume}" data-vol="1"><span class="v">${p.volume}%</span></div>`;
  }

  function bindPlayerControls(root, p) {
    root.querySelectorAll('[data-c]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); send('cmd', { id: p.id, cmd: b.dataset.c }); });
    root.querySelectorAll('[data-mute]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); send('mute', { id: p.id, value: !p.muted }); });
    root.querySelectorAll('[data-power]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); send('power', { id: p.id, value: !p.power }); });
    root.querySelectorAll('[data-vol]').forEach((r) => {
      const lab = r.parentElement.querySelector('.v');
      paintRange(r);
      r.oninput = () => { MA.drag[p.id] = true; lab.textContent = r.value + '%'; paintRange(r); };
      r.onchange = () => { MA.drag[p.id] = false; send('volume', { id: p.id, value: parseInt(r.value, 10) }); };
    });
  }

  // ---------- Suche ----------
  function renderSearchChips() {
    const types = (MA.state.types || []).filter((t) => TYPE_LABEL[t]);
    if (MA.types.size === 0) types.forEach((t) => MA.types.add(t));
    $('typeChips').innerHTML = types.map((t) => `<button class="chip ${MA.types.has(t) ? 'on' : ''}" data-t="${t}">${T(TYPE_LABEL[t])}</button>`).join('');
    $('typeChips').querySelectorAll('.chip').forEach((c) => c.onclick = () => {
      const t = c.dataset.t; MA.types.has(t) ? MA.types.delete(t) : MA.types.add(t); renderSearchChips();
      if (MA.lastResults) renderResults(MA.lastResults);
    });
    renderTargets();
  }
  function renderTargets() {
    const ps = MA.state.players.filter((p) => p.available);
    if (MA.targets.size === 0 && MA.current) MA.targets.add(MA.current);
    ['targetChips', 'favTargetChips'].forEach((box) => {
      $(box).innerHTML = ps.map((p) => `<button class="chip ${MA.targets.has(p.id) ? 'on' : ''}" data-id="${esc(p.id)}">${esc(p.name)}</button>`).join('');
      $(box).querySelectorAll('.chip').forEach((c) => c.onclick = () => { const id = c.dataset.id; MA.targets.has(id) ? MA.targets.delete(id) : MA.targets.add(id); renderTargets(); });
    });
  }
  function doSearch() {
    const q = $('q').value.trim();
    if (!q) return;
    $('q').blur();
    $('results').innerHTML = `<div class="empty">${T('Searching …')}</div>`;
    send('search', { query: q, types: Array.from(MA.types) });
  }
  $('qbtn').onclick = doSearch;
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });

  function renderResults(msg) {
    MA.lastResults = msg; MA.favItems = {}; MA.lastIdx = 0;
    if (msg.error) { $('results').innerHTML = `<div class="empty">${esc(msg.error)}</div>`; return; }
    let html = '';
    (msg.groups || []).forEach((g) => {
      if (!g.items.length || (MA.types.size && !MA.types.has(g.type))) return;
      html += `<div class="label">${T(TYPE_LABEL[g.type] || g.type)}</div>`;
      g.items.forEach((it) => {
        html += `<div class="item" data-uri="${esc(it.uri)}">${thumb(it.image, g.type === 'radio' ? 'radio' : 'note')}<div class="txt"><div class="n">${esc(String(it.name).trim())}</div><div class="s">${esc(it.sub)}</div></div><button class="ib sm star ${isFav(g.type, it.uri) ? 'on' : ''}" data-fav="${MA.lastIdx = (MA.lastIdx || 0) + 1}" title="${T('Save as favorite')}">${svg(isFav(g.type, it.uri) ? 'star' : 'starO')}</button><button class="ib sm">${svg('play')}</button></div>`;
        MA.favItems[MA.lastIdx] = Object.assign({ type: g.type }, it);
      });
    });
    $('results').innerHTML = html || `<div class="empty">${T('No results')}</div>`;
    $('results').querySelectorAll('[data-fav]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); send('favAdd', { item: MA.favItems[b.dataset.fav] }); });
    $('results').querySelectorAll('.item').forEach((el) => el.onclick = () => {
      if (MA.targets.size === 0) { toast(T('Select at least one player')); return; }
      send('playMedia', { uri: el.dataset.uri, targets: Array.from(MA.targets), option: 'replace' });
      toast(T('Starting …'));
    });
  }

  // ---------- Geräte ----------
  function renderDevices() {
    const list = MA.state.players;
    if (!list.length) { $('devList').innerHTML = `<div class="empty">${T(MA.state.connected ? 'No players' : 'Not connected to Music Assistant')}</div>`; return; }
    $('devList').innerHTML = list.map((p) => devHTML(p)).join('');
    list.forEach((p) => bindDevice(p));
  }
  function devHTML(p) {
    const hasTone = p.tone && MA.state.showTone;
    const tone = hasTone ? `<div class="tone ${MA.openTone.has(p.id) ? 'open' : ''}">
        <div class="row"><span>${T('Tone control')}</span><button class="switch ${p.tone.enabled ? 'on' : ''}" data-tone-en="1"></button></div>
        ${toneRow('bass', T('Bass'), p.tone.bass, -10, 10)}${toneRow('mid', T('Mid'), p.tone.mid, -10, 10)}${toneRow('treble', T('Treble'), p.tone.treble, -10, 10)}${toneRow('gain', T('Gain'), p.tone.gain, -15, 15)}
      </div>` : '';
    const active = p.state === 'playing' || p.state === 'paused';
    const isMaster = (p.members || []).length > 0;
    const leader = p.syncedTo ? player(p.syncedTo) : null;
    const canSync = (p.canGroup || []).some((id) => id !== p.id && player(id));
    const badge = isMaster ? `<span class="badge">${T('Master')}</span>` : (p.syncedTo ? `<span class="badge f">${T('Sync')}</span>` : '');
    let sync = '';
    if (leader) sync = `<div class="sync"><span class="s">${T('Plays in sync with')} ${esc(leader.name)}</span></div>`;
    else if (canSync) sync = `<div class="sync"><span class="lbl">${T('Master')}</span><span class="s">${isMaster ? T('Plays in sync with') + ' ' + esc((p.members || []).map((m) => (player(m) || {}).name || m).join(', ')) : T('All players play in sync')}</span><button class="switch ${isMaster ? 'on' : ''}" data-master="1"></button></div>`;
    else sync = `<div class="sync"><span class="s">${T('Cannot be synced with the other players')}</span></div>`;
    return `<div class="dev ${p.available ? '' : 'na'}" id="dev-${esc(p.id)}">
      <div class="head">
        ${thumb(p.image, 'speaker')}
        <div class="txt"><div class="n">${esc(p.name)}${badge}</div><div class="s">${esc(stateText(p))}</div></div>
        ${p.power !== null ? `<button class="ib sm ${p.power ? 'on' : ''}" data-power="1" title="${T('Power')}">${svg('power')}</button>` : ''}
        ${active ? `<button class="ib sm" data-c="play_pause">${svg(p.state === 'playing' ? 'pause' : 'play')}</button>` : ''}
        ${hasTone ? `<button class="ib sm ${MA.openTone.has(p.id) ? 'on' : ''}" data-tone-toggle="1" title="${T('Tone control')}">${svg('tone')}</button>` : ''}
      </div>
      ${volumeRow(p)}${sync}${tone}</div>`;
  }
  function toneRow(key, label, val, min, max) {
    return `<div class="row"><span>${label}</span><input type="range" min="${min}" max="${max}" step="0.5" value="${val}" data-tone="${key}"><span class="v">${(+val).toFixed(1)} dB</span></div>`;
  }
  function bindDevice(p) {
    const root = document.getElementById('dev-' + p.id);
    if (!root) return;
    bindPlayerControls(root, p);
    const tg = root.querySelector('[data-tone-toggle]');
    if (tg) tg.onclick = () => { MA.openTone.has(p.id) ? MA.openTone.delete(p.id) : MA.openTone.add(p.id); renderDevices(); };
    const ms = root.querySelector('[data-master]');
    if (ms) ms.onclick = () => { ms.classList.toggle('on'); send('master', { id: p.id, value: !(p.members || []).length }); };
    const en = root.querySelector('[data-tone-en]');
    if (en) en.onclick = () => send('tone', { id: p.id, change: { enabled: !p.tone.enabled } });
    root.querySelectorAll('[data-tone]').forEach((r) => {
      const lab = r.parentElement.querySelector('.v');
      paintRange(r);
      r.oninput = () => { MA.drag[p.id] = true; lab.textContent = (+r.value).toFixed(1) + ' dB'; paintRange(r); };
      r.onchange = () => { MA.drag[p.id] = false; send('tone', { id: p.id, change: { [r.dataset.tone]: parseFloat(r.value) } }); };
    });
  }

  // ---------- Favoriten ----------
  function isFav(type, uri) { return ((MA.state.favs || {})[type] || []).some((f) => f && f.uri === uri); }
  function renderFavs() {
    $('favTypeChips').innerHTML = Object.keys(TYPE_LABEL).map((t) => {
      const n = ((MA.state.favs || {})[t] || []).filter(Boolean).length;
      return `<button class="chip ${MA.favType === t ? 'on' : ''}" data-t="${t}">${T(TYPE_LABEL[t])}${n ? ' · ' + n : ''}</button>`;
    }).join('');
    $('favTypeChips').querySelectorAll('.chip').forEach((c) => c.onclick = () => { MA.favType = c.dataset.t; renderFavs(); });
    $('favEdit').textContent = T(MA.favEdit ? 'Done' : 'Edit');
    $('favEdit').classList.toggle('on', MA.favEdit);
    const list = ((MA.state.favs || {})[MA.favType] || []);
    const icon = MA.favType === 'radio' ? 'radio' : 'note';
    let html = '';
    for (let i = 0; i < 20; i++) {
      const f = list[i];
      if (!f) {
        html += `<div class="slot free"><span class="no">${i + 1}</span>${thumb('', icon)}<div class="txt"><div class="n">${T('Free')}</div></div>${MA.favEdit && i > 0 ? `<button class="ib sm" data-move="-1" data-i="${i}">${svg('up')}</button>` : ''}</div>`;
        continue;
      }
      if (MA.favEdit) {
        html += `<div class="slot"><span class="no">${i + 1}</span>${thumb(f.image, icon)}<div class="txt"><input value="${esc(f.name)}" data-rename="${i}" maxlength="80"></div>
          <button class="ib sm" data-move="-1" data-i="${i}" ${i === 0 ? 'disabled' : ''}>${svg('up')}</button><button class="ib sm" data-move="1" data-i="${i}" ${i === 19 ? 'disabled' : ''}>${svg('down')}</button><button class="ib sm" data-del="${i}" title="${T('Delete')}">${svg('del')}</button></div>`;
      } else {
        html += `<div class="slot fill" data-play="${i}"><span class="no">${i + 1}</span>${thumb(f.image, icon)}<div class="txt"><div class="n">${esc(f.name)}</div><div class="s">${esc(f.sub)}</div></div><button class="ib sm">${svg('play')}</button></div>`;
      }
    }
    if (!list.some(Boolean)) html = `<div class="hint" style="padding:6px 0 10px">${T('Save favorites with the star in Search or Now playing.')}</div>` + html;
    $('favList').innerHTML = html;
    $('favList').querySelectorAll('[data-play]').forEach((el) => el.onclick = () => {
      if (MA.targets.size === 0) { toast(T('Select at least one player')); return; }
      send('playMedia', { uri: list[+el.dataset.play].uri, targets: Array.from(MA.targets), option: 'replace' });
      toast(T('Starting …'));
    });
    $('favList').querySelectorAll('[data-move]').forEach((b) => b.onclick = () => send('favMove', { type: MA.favType, slot: +b.dataset.i, dir: +b.dataset.move }));
    $('favList').querySelectorAll('[data-del]').forEach((b) => b.onclick = () => send('favDelete', { type: MA.favType, slot: +b.dataset.del }));
    $('favList').querySelectorAll('[data-rename]').forEach((inp) => {
      inp.onchange = () => send('favRename', { type: MA.favType, slot: +inp.dataset.rename, name: inp.value });
      inp.onkeydown = (e) => { if (e.key === 'Enter') inp.blur(); };
    });
  }
  $('favEdit').onclick = () => { MA.favEdit = !MA.favEdit; renderFavs(); };

  function renderAll() { renderNow(); renderSearchChips(); renderDevices(); renderFavs(); }

  // ---------- Nachrichten vom Modul ----------
  function handleMessage(data) {
    const msg = typeof data === 'string' ? JSON.parse(data) : data;
    switch (msg.type) {
      case 'full':
        MA.state = msg.state;
        renderAll();
        break;
      case 'player': {
        const i = MA.state.players.findIndex((p) => p.id === msg.player.id);
        if (i >= 0) MA.state.players[i] = msg.player; else MA.state.players.push(msg.player);
        if (MA.drag[msg.player.id]) return;   // Regler wird gerade bewegt
        renderNow();
        renderDevices();
        renderSearchChips();
        break;
      }
      case 'remove':
        MA.state.players = MA.state.players.filter((p) => p.id !== msg.id);
        renderAll();
        break;
      case 'favs':
        MA.state.favs = msg.favs;
        renderFavs();
        renderNow();
        if (MA.lastResults) renderResults(MA.lastResults);
        break;
      case 'search':
        renderResults(msg);
        break;
      case 'toast':
        toast(msg.text);
        break;
    }
  }
</script>
